name: Shop-Pilot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 5
          DATABASE_URL=postgresql://root:rootpassword@localhost:51215/razorpay_integration_test npx prisma migrate deploy
          DATABASE_URL=postgresql://root:rootpassword@localhost:51215/razorpay_integration_test npm run test:integration
          docker compose -f docker-compose.test.yml down

      - name: Production Build
        run: npm run build
