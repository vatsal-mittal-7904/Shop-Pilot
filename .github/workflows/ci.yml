name: Shop-Pilot CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: demo
      DATABASE_URL: postgresql://postgres:postgres@localhost:51214/razorpay_integration_test
      OFFER_BINDING_SECRET: ci_test_offer_binding_secret_12345
      AUDIT_HMAC_SECRET: ci_test_audit_hmac_secret_123456789
      GEMINI_API_KEY: test_mock_gemini_key
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint Codebase
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        run: |
          docker compose -f docker-compose.test.yml up -d
          until docker compose -f docker-compose.test.yml exec -T db-test pg_isready -U postgres -d razorpay_integration_test; do
            echo "Waiting for postgres to be ready..."
            sleep 1
          done
          DATABASE_URL=postgresql://postgres:postgres@localhost:51214/razorpay_integration_test npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:postgres@localhost:51214/razorpay_integration_test npm run test:integration
          docker compose -f docker-compose.test.yml down

      - name: Production Build
        run: npm run build

