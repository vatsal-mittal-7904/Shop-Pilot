version: '3.8'

services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: razorpay_integration_test
    ports:
      - "51214:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d razorpay_integration_test"]
      interval: 2s
      timeout: 5s
      retries: 10
